<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rafael</title>
  <style>
    :root {
      --void: #05070c;
      --ice: #d8f4ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--void);
      color: var(--ice);
      color-scheme: dark;
    }

    body {
      min-height: 100dvh;
    }

    ::selection {
      background: var(--ice);
      color: var(--void);
    }

    main {
      position: relative;
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }

    .talk {
      width: 88px;
      height: 88px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ice);
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .talk:focus-visible {
      outline: 2px solid var(--ice);
      outline-offset: 10px;
    }

    .bars {
      position: relative;
      width: 88px;
      height: 88px;
    }

    .bars i {
      position: absolute;
      width: 10px;
      border-radius: 5px;
      background: currentColor;
      transform-origin: center;
    }

    .bars i:nth-child(1) { left: 6px; top: 34px; height: 20px; }
    .bars i:nth-child(2) { left: 22px; top: 22px; height: 44px; }
    .bars i:nth-child(3) { left: 38px; top: 10px; height: 68px; }
    .bars i:nth-child(4) { left: 54px; top: 22px; height: 44px; }
    .bars i:nth-child(5) { left: 70px; top: 34px; height: 20px; }

    .talk.is-recording .bars i:nth-child(1) { animation: bar-side 520ms cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .talk.is-recording .bars i:nth-child(2) { animation: bar-mid 380ms cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .talk.is-recording .bars i:nth-child(3) { animation: bar-center 460ms cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .talk.is-recording .bars i:nth-child(4) { animation: bar-mid 420ms cubic-bezier(0.2, 0.8, 0.2, 1) infinite reverse; }
    .talk.is-recording .bars i:nth-child(5) { animation: bar-side 560ms cubic-bezier(0.2, 0.8, 0.2, 1) infinite reverse; }

    @keyframes bar-side { 50% { transform: scaleY(1.45); } }
    @keyframes bar-mid { 50% { transform: scaleY(0.62); } }
    @keyframes bar-center { 50% { transform: scaleY(0.8); } }

    @media (prefers-reduced-motion: reduce) {
      .talk.is-recording .bars i { animation: none; opacity: 0.55; }
    }

    .fail {
      position: absolute;
      top: calc(50% + 72px);
      left: 24px;
      right: 24px;
      margin: 0;
      text-align: center;
      font-family: system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.4;
    }

    .fail strong {
      display: block;
      font-weight: 560;
      margin-bottom: 4px;
    }

    .fail span {
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <button type="button" class="talk" aria-label="Falar com Rafael" aria-pressed="false">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    </button>
    <p class="fail" hidden>
      <strong>Sem microfone</strong>
      <span>Permita o microfone para falar com Rafael.</span>
    </p>
  </main>
  <script>
    const button = document.querySelector(".talk");
    const fail = document.querySelector(".fail");
    let recorder = null;
    let stream = null;
    let starting = false;

    function listening(on) {
      button.classList.toggle("is-recording", on);
      button.setAttribute("aria-pressed", on ? "true" : "false");
      button.setAttribute("aria-label", on ? "Parar" : "Falar com Rafael");
    }

    function releaseMic() {
      if (recorder && recorder.state !== "inactive") recorder.stop();
      if (stream) stream.getTracks().forEach((track) => track.stop());
      recorder = null;
      stream = null;
      listening(false);
    }

    async function toggle() {
      if (stream) {
        releaseMic();
        return;
      }
      if (starting) {
        starting = false;
        return;
      }
      starting = true;
      fail.hidden = true;
      try {
        const next = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (!starting) {
          next.getTracks().forEach((track) => track.stop());
          return;
        }
        stream = next;
        recorder = new MediaRecorder(stream);
        recorder.start();
        listening(true);
      } catch (error) {
        releaseMic();
        fail.hidden = false;
      } finally {
        starting = false;
      }
    }

    button.addEventListener("click", toggle);
  </script>
</body>
</html>
